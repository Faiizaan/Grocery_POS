version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pospass}
      POSTGRES_DB: posdb
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-pospass}@db:5432/posdb
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      NODE_ENV: production
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on: [db]
  web:
    build: ./frontend
    ports: ["80:80"]
    depends_on: [api]
volumes:
  dbdata: