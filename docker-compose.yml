services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pospass}
      POSTGRES_DB: posdb
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-pospass}@db:5432/posdb
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Static passwords for "Delete selected" and "Show total stock value" on the Products page.
      # Leave empty to switch the feature off.
      PRODUCT_DELETE_PASSWORD: ${PRODUCT_DELETE_PASSWORD:-}
      STOCK_VALUE_PASSWORD: ${STOCK_VALUE_PASSWORD:-}
      # Store time zone: report days and invoice numbers follow it
      TZ: ${TZ:-Asia/Karachi}
      NODE_ENV: production
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on: [db]
  web:
    build: ./frontend
    ports: ["80:80"]
    depends_on: [api]
volumes:
  dbdata:
