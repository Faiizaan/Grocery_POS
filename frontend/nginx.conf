server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The app page itself must never be cached: after an update the browser would keep
  # showing the old version until F5 is pressed.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
  }

  # Built JS/CSS have a content hash in their file name (index-AbC123.js), so a new
  # version always gets a new name. Safe to cache for a long time.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
